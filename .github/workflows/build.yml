name: Build Shroudtopia

on:
  workflow_dispatch:

jobs:
  windows:
    name: win_x64
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: ilammy/msvc-dev-cmd@v1
    - name: configure_funchook
      run: cmake -S third-party/funchook -B third-party/funchook/build -G "Visual Studio 18 2026" -A x64
      shell: cmd
    - name: build_core
      run: |
        MSBuild "shroudtopia.sln" /t:shroudtopia /p:Configuration=Release /p:OutDir="${{ github.workspace }}/build/" /p:Platform=x64
      shell: cmd
    - name: build_proxy
      run: |
        MSBuild "winmm\winmm.vcxproj" /t:Build /p:Configuration=Release /p:OutDir="${{ github.workspace }}/build/" /p:Platform=x64
      shell: cmd
    - name: upload
      uses: actions/upload-artifact@v4
      with:
        name: win_x64
        path: |
          ${{ github.workspace }}/build/*.dll
          ${{ github.workspace }}/build/mods/**/*.dll
